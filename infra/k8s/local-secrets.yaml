# Local demo credentials only. Replace before using a shared cluster.
apiVersion: v1
kind: Secret
metadata:
  name: fiapx-secrets
type: Opaque
stringData:
  POSTGRES_USER: fiapx
  POSTGRES_PASSWORD: fiapx
  RABBITMQ_DEFAULT_USER: fiapx
  RABBITMQ_DEFAULT_PASS: fiapx
  MINIO_ROOT_USER: minioadmin
  MINIO_ROOT_PASSWORD: minioadmin
  DATABASE_URL: postgres://fiapx:fiapx@postgres:5432/fiapx
  RABBITMQ_URL: amqp://fiapx:fiapx@rabbitmq:5672
  RABBITMQ_MANAGEMENT_URL: http://fiapx:fiapx@rabbitmq.fiapx.svc.cluster.local:15672/
  S3_ACCESS_KEY: minioadmin
  S3_SECRET_KEY: minioadmin
  JWT_SECRET: change-me-local-only
  GF_SECURITY_ADMIN_PASSWORD: admin
