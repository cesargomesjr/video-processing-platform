apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: fiapx
resources:
  - k8s/namespace.yaml
  - k8s/local-secrets.yaml
  - k8s/dependencies.yaml
  - k8s/application.yaml
  - k8s/monitoring.yaml
  - k8s/autoscaling.yaml
  - k8s/worker-keda.yaml
configMapGenerator:
  - name: postgres-schema
    files:
      - 01-schema.sql=db/01-schema.sql
  - name: prometheus-config
    files:
      - prometheus.yml=k8s/prometheus.yml
  - name: loki-config
    files:
      - loki.yml=k8s/loki.yml
  - name: alloy-config
    files:
      - config.alloy=k8s/alloy.alloy
  - name: grafana-datasource
    files:
      - datasources.yml=k8s/grafana-datasources.yml
  - name: grafana-dashboard-provider
    files:
      - dashboard.yml=k8s/grafana-dashboard-provider.yml
  - name: grafana-dashboard
    files:
      - video-processing.json=grafana/dashboards/video-processing.json
