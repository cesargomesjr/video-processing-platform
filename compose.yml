name: fiapx

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: fiapx-api:local
    init: true
    environment:
      NODE_ENV: development
      APP_PORT: 3000
    ports:
      - '127.0.0.1:${API_HOST_PORT:-3000}:3000'
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
