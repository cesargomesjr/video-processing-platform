name: fiapx

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fiapx
      POSTGRES_PASSWORD: fiapx
      POSTGRES_USER: fiapx
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fiapx -d fiapx']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  firebase-auth:
    build:
      context: .
      dockerfile: apps/firebase-emulator/Dockerfile
    image: fiapx-firebase-auth:local
    init: true
    ports:
      - '127.0.0.1:${FIREBASE_AUTH_HOST_PORT:-9099}:9099'
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  minio:
    build:
      context: .
      dockerfile: apps/minio/Dockerfile
    image: fiapx-minio:local
    environment:
      MINIO_ROOT_USER: fiapx
      MINIO_ROOT_PASSWORD: fiapx-local-secret
    ports:
      - '127.0.0.1:${MINIO_HOST_PORT:-9000}:9000'
      - '127.0.0.1:${MINIO_CONSOLE_HOST_PORT:-9001}:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--quiet',
          '--spider',
          'http://127.0.0.1:9000/minio/health/live',
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.1.4-management-alpine
    environment:
      RABBITMQ_DEFAULT_PASS: fiapx
      RABBITMQ_DEFAULT_USER: fiapx
    ports:
      - '127.0.0.1:${RABBITMQ_HOST_PORT:-5672}:5672'
      - '127.0.0.1:${RABBITMQ_MANAGEMENT_HOST_PORT:-15672}:15672'
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: fiapx-api:local
    init: true
    environment:
      NODE_ENV: development
      APP_PORT: 3000
      DATABASE_URL: postgresql://fiapx:fiapx@postgres:5432/fiapx
      FIREBASE_AUTH_EMULATOR_HOST: firebase-auth:9099
      FIREBASE_PROJECT_ID: demo-fiapx
      OBJECT_STORAGE_ACCESS_KEY: fiapx
      OBJECT_STORAGE_BUCKET: fiapx-videos
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_PUBLIC_ENDPOINT: http://127.0.0.1:${MINIO_HOST_PORT:-9000}
      OBJECT_STORAGE_SECRET_KEY: fiapx-local-secret
      RABBITMQ_URL: amqp://fiapx:fiapx@rabbitmq:5672
      VIDEO_UPLOAD_MAX_BYTES: 2147483648
      VIDEO_UPLOAD_TTL_SECONDS: 900
    depends_on:
      firebase-auth:
        condition: service_healthy
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - '127.0.0.1:${API_HOST_PORT:-3000}:3000'
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  minio_data:
    name: fiapx-minio-data
  postgres_data:
    name: fiapx-postgres-data
  rabbitmq_data:
    name: fiapx-rabbitmq-data
